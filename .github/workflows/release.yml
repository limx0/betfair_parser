---
name: Release

on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag version schema
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Tag '${GITHUB_REF_NAME}' does not match the version schema MAJOR.MINOR[.PATCH]" >&2
            exit 1
          fi

      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: '3.15'

      - name: Set version from git tag
        run: uv version "${GITHUB_REF_NAME}"

      - name: Build distributions
        run: uv build

      - name: Check build artifacts
        run: |
          uvx twine check --strict dist/*

      - name: Verify the built wheel is installable
        if: github.event_name == 'push'
        run: |
          uv venv /tmp/wheel-test
          uv pip install --python /tmp/wheel-test/bin/python dist/betfair_parser*.whl
          /tmp/wheel-test/bin/python -c "import betfair_parser"

      - name: Publish package to test pypi
        if: github.repository == 'limx0/betfair_parser' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          user: __token__
          password: ${{ secrets.TESTPYPI_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
          verbose: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: releases
          path: dist

  upload-pypi:
    needs: build
    if: github.repository == 'limx0/betfair_parser' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: releases
          path: dist

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_TOKEN }}
